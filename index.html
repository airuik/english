<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M3U8 工具｜在线播放 + 并发解密下载</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
body {
  background-color: #f5f7fa;
  padding: 16px;
  max-width: 1000px;
  margin: 0 auto;
  color: #222;
  line-height: 1.55;
}
.card {
  background: #ffffff;
  border-radius: 12px;
  padding: 18px;
  margin-bottom: 14px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.07);
}
.title {
  font-size: 20px;
  font-weight: 600;
  margin-bottom: 16px;
  text-align: center;
  color: #1f2937;
}
.input-row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: center;
}
#urlInput {
  flex: 1;
  min-width: 220px;
  padding: 10px 12px;
  font-size: 14px;
  border: 1px solid #d1d5db;
  border-radius: 8px;
  outline: none;
  transition: border 0.2s;
}
#urlInput:focus {
  border-color: #2563eb;
}
button {
  padding: 10px 16px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 500;
  transition: all 0.2s;
  white-space: nowrap;
}
button:disabled {
  background-color: #d1d5db !important;
  color: #888 !important;
  cursor: not-allowed;
}
#parseBtn {
  background-color: #2563eb;
  color: white;
}
#playBtn {
  background-color: #7c3aed;
  color: white;
}
#downloadAllBtn, #downloadRangeBtn {
  background-color: #059669;
  color: white;
}
#parseBtn:hover:not(:disabled) { background-color: #1d4ed8; }
#playBtn:hover:not(:disabled) { background-color: #6d28d9; }
#downloadAllBtn:hover:not(:disabled),
#downloadRangeBtn:hover:not(:disabled) { background-color: #047857; }
.range-row {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 8px;
}
.range-row span {
  font-size: 14px;
  color: #444;
}
input[type="number"] {
  width: 84px;
  padding: 9px 10px;
  border: 1px solid #d1d5db;
  border-radius: 8px;
  font-size: 14px;
  outline: none;
}
input[type="number"]:focus {
  border-color: #2563eb;
}
#keyInfo {
  background: #e8f4fd;
  padding: 14px;
  border-left: 4px solid #2196f3;
  border-radius: 8px;
  white-space: pre-line;
  font-size: 14px;
  color: #1e3a5f;
}
#progress {
  background: #fff8e1;
  padding: 14px;
  border-left: 4px solid #ff9800;
  border-radius: 8px;
  white-space: pre-line;
  min-height: 64px;
  font-size: 14px;
  color: #6b4800;
}
.video-wrap {
  margin-top: 10px;
}
video {
  width: 100%;
  border-radius: 8px;
  background: #000;
  display: block;
}
@media (max-width: 640px) {
  .input-row {
    flex-direction: column;
    align-items: stretch;
  }
  .range-row {
    justify-content: flex-start;
  }
  button {
    width: 100%;
  }
}
</style>
</head>
<body>
<div class="title">M3U8 工具｜在线播放 + 并发解密下载</div>

<div class="card">
  <div class="input-row">
    <input id="urlInput" placeholder="粘贴 m3u8 地址">
    <button id="parseBtn">解析M3U8</button>
    <button id="playBtn">在线播放</button>
  </div>
</div>

<div class="card">
  <div id="keyInfo">等待解析 KEY / IV 信息...</div>
</div>

<div class="card">
  <div class="range-row">
    <span>分片区间（序号）：</span>
    <div>
    <input id="startSn" type="number" min="1" placeholder="起始">
    <span> ~ </span>
    <input id="endSn" type="number" min="1" placeholder="结束">
    </div>
    <button id="downloadRangeBtn" disabled>下载区间</button>
    <button id="downloadAllBtn" disabled>下载全部</button>
  </div>
</div>

<div class="card">
  <div id="progress">等待任务...</div>
</div>

<div class="card video-wrap">
  <video id="video" controls></video>
</div>

<script>
const urlInput = document.getElementById('urlInput');
const parseBtn = document.getElementById('parseBtn');
const playBtn = document.getElementById('playBtn');
const downloadAllBtn = document.getElementById('downloadAllBtn');
const downloadRangeBtn = document.getElementById('downloadRangeBtn');
const startSnInput = document.getElementById('startSn');
const endSnInput = document.getElementById('endSn');
const keyInfoDom = document.getElementById('keyInfo');
const progressDom = document.getElementById('progress');
const video = document.getElementById('video');

let m3u8Data = null;
let isDownloading = false;
let hls = null;
const CONCURRENCY = 6;

// 十六进制转 Uint8Array
function hexToUint8Array(hex) {
  hex = hex.replace(/^0x/, '');
  if (hex.length % 2 !== 0) hex = '0' + hex;
  const bytes = new Uint8Array(hex.length / 2);
  for (let i = 0; i < hex.length; i += 2) {
    bytes[i / 2] = parseInt(hex.substr(i, 2), 16);
  }
  return bytes;
}

// 解析m3u8
function parseM3u8(text, baseUrl) {
  const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  const result = {
    encrypted: false,
    method: '',
    keyUri: '',
    ivHex: '',
    fragments: [],
    mediaSequence: 0
  };
  let sn = 0;
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    if (line.startsWith('#EXT-X-KEY:')) {
      result.encrypted = true;
      const methodMatch = line.match(/METHOD=([^,]+)/);
      const uriMatch = line.match(/URI="([^"]+)"/);
      const ivMatch = line.match(/IV=([^\s,]+)/);
      if (methodMatch) result.method = methodMatch[1];
      if (uriMatch) result.keyUri = new URL(uriMatch[1], baseUrl).href;
      if (ivMatch) result.ivHex = ivMatch[1].replace(/^0x/, '');
    } else if (line.startsWith('#EXT-X-MEDIA-SEQUENCE:')) {
      result.mediaSequence = parseInt(line.split(':')[1]);
      sn = result.mediaSequence;
    } else if (line.startsWith('#EXTINF:')) {
      i++;
      if (i < lines.length && !lines[i].startsWith('#')) {
        const absoluteUrl = new URL(lines[i], baseUrl).href;
        result.fragments.push({ sn, url: absoluteUrl });
        sn++;
      }
    }
  }
  return result;
}

// AES解密
async function decryptFragment(encryptedBuffer, key, iv) {
  const decrypted = await crypto.subtle.decrypt(
    { name: 'AES-CBC', iv: iv },
    key,
    encryptedBuffer
  );
  return new Uint8Array(decrypted);
}

// 下载blob
function downloadBlob(blob, filename) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
}

// 并发池
async function poolRunner(tasks, concurrency) {
  const results = new Array(tasks.length);
  let idx = 0;
  const run = async () => {
    while (idx < tasks.length) {
      const curIdx = idx++;
      results[curIdx] = await tasks[curIdx]();
    }
  }
  const workers = Array.from({ length: concurrency }, () => run());
  await Promise.all(workers);
  return results;
}

// 【在线播放 m3u8，hls.js】
playBtn.onclick = async () => {
  const m3u8Url = urlInput.value.trim();
  if (!m3u8Url) return alert("请输入m3u8地址");

  progressDom.innerText = "正在加载在线播放...";
  if (hls) {
    hls.destroy();
    hls = null;
  }
  if (Hls.isSupported()) {
    hls = new Hls();
    hls.loadSource(m3u8Url);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, () => {
      video.play();
      progressDom.innerText = "✅ 在线播放已加载（直接读取远端m3u8分片）";
    });
    hls.on(Hls.Events.ERROR, (e, data) => {
      progressDom.innerText = "❌ 播放异常：" + data.details;
      console.error(data);
    });
  } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    // Safari原生支持m3u8
    video.src = m3u8Url;
    video.play();
    progressDom.innerText = "✅ Safari原生播放m3u8";
  }
}

parseBtn.onclick = async () => {
  const m3u8Url = urlInput.value.trim();
  if (!m3u8Url) {
    keyInfoDom.innerText = "请输入m3u8地址";
    return;
  }
  m3u8Data = null;
  downloadAllBtn.disabled = true;
  downloadRangeBtn.disabled = true;
  keyInfoDom.innerText = "正在请求m3u8文本...";
  progressDom.innerText = "解析中...";

  try {
    const resp = await fetch(m3u8Url);
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    const txt = await resp.text();
    m3u8Data = parseM3u8(txt, m3u8Url);
    if (m3u8Data.encrypted) {
      keyInfoDom.innerText =`✅ 解析成功`;
    } else {
      keyInfoDom.innerText = "✅ 解析成功，无加密";
    }
    progressDom.innerText = `分片总数：${m3u8Data.fragments.length}`;
    downloadAllBtn.disabled = false;
    downloadRangeBtn.disabled = false;
  } catch (err) {
    keyInfoDom.innerText = "❌ 解析失败：" + err.message;
  }
};

// 并发下载解密（原来的下载功能保留）
async function downloadFragList(selectedFrags) {
  if (isDownloading || selectedFrags.length === 0) return;
  isDownloading = true;
  downloadAllBtn.disabled = true;
  downloadRangeBtn.disabled = true;
  let cryptoKey = null;
  let ivBase = null;
  const total = selectedFrags.length;
  try {
    if (m3u8Data.encrypted) {
      progressDom.innerText = "🔑 拉取密钥";
      const kr = await fetch(m3u8Data.keyUri);
      if (!kr.ok) throw new Error("密钥失败");
      const kb = await kr.arrayBuffer();
      if (kb.byteLength !== 16) throw new Error("密钥长度不对");
      cryptoKey = await crypto.subtle.importKey('raw', kb, { name: 'AES-CBC' }, false, ['decrypt']);
      if (m3u8Data.ivHex) ivBase = hexToUint8Array(m3u8Data.ivHex);
    }
    const taskList = selectedFrags.map((frag, i) => async () => {
      const r = await fetch(frag.url);
      if (!r.ok) throw new Error(`分片${frag.sn}失败`);
      const buf = await r.arrayBuffer();
      let d;
      if (m3u8Data.encrypted) {
        const iv = ivBase || hexToUint8Array(frag.sn.toString(16).padStart(32, '0'));
        d = await decryptFragment(buf, cryptoKey, iv);
      } else {
        d = new Uint8Array(buf);
      }
      progressDom.innerText = `📥 下载 ${i+1}/${total}, SN:${frag.sn}`;
      return { sn: frag.sn, data: d };
    });
    const res = await poolRunner(taskList, CONCURRENCY);
    res.sort((a, b) => a.sn - b.sn);
    const bufs = res.map(x => x.data);
    const blob = new Blob(bufs, { type: "video/mp4" });
    downloadBlob(blob, "video.mp4");
    progressDom.innerText = "✅ 下载合并完成";
  } catch (e) {
    progressDom.innerText = "❌ 下载失败：" + e.message;
  }
  isDownloading = false;
  downloadAllBtn.disabled = false;
  downloadRangeBtn.disabled = false;
}

downloadAllBtn.onclick = () => downloadFragList(m3u8Data.fragments);
downloadRangeBtn.onclick = () => {
  const s = Number(startSnInput.value) - 1;
  const e = Number(endSnInput.value);
  const list = m3u8Data.fragments.slice(s, e);
  downloadFragList(list);
}
</script>
</body>
</html>
