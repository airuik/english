<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M3U8 手动解密下载｜直接合并TS改后缀mp4</title>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
body {
  background-color: #f5f7fa;
  padding: 16px;
  max-width: 1000px;
  margin: 0 auto;
  color: #222;
  line-height: 1.55;
}
.card {
  background: #ffffff;
  border-radius: 12px;
  padding: 18px;
  margin-bottom: 14px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.07);
}
.title {
  font-size: 20px;
  font-weight: 600;
  margin-bottom: 16px;
  text-align: center;
  color: #1f2937;
}
.input-row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: center;
}
#urlInput {
  flex: 1;
  min-width: 220px;
  padding: 10px 12px;
  font-size: 14px;
  border: 1px solid #d1d5db;
  border-radius: 8px;
  outline: none;
  transition: border 0.2s;
}
#urlInput:focus {
  border-color: #2563eb;
}
button {
  padding: 10px 16px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 500;
  transition: all 0.2s;
  white-space: nowrap;
}
button:disabled {
  background-color: #d1d5db !important;
  color: #888 !important;
  cursor: not-allowed;
}
#parseBtn {
  background-color: #2563eb;
  color: white;
}
#parseBtn:hover:not(:disabled) {
  background-color: #1d4ed8;
}
#downloadAllBtn, #downloadRangeBtn {
  background-color: #059669;
  color: white;
}
#downloadAllBtn:hover:not(:disabled),
#downloadRangeBtn:hover:not(:disabled) {
  background-color: #047857;
}
.range-row {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 8px;
}
.range-row span {
  font-size: 14px;
  color: #444;
}
input[type="number"] {
  width: 84px;
  padding: 9px 10px;
  border: 1px solid #d1d5db;
  border-radius: 8px;
  font-size: 14px;
  outline: none;
}
input[type="number"]:focus {
  border-color: #2563eb;
}
#keyInfo {
  background: #e8f4fd;
  padding: 14px;
  border-left: 4px solid #2196f3;
  border-radius: 8px;
  white-space: pre-line;
  font-size: 14px;
  color: #1e3a5f;
}
#progress {
  background: #fff8e1;
  padding: 14px;
  border-left: 4px solid #ff9800;
  border-radius: 8px;
  white-space: pre-line;
  min-height: 64px;
  font-size: 14px;
  color: #6b4800;
}
.video-wrap {
  margin-top: 10px;
}
video {
  width: 100%;
  border-radius: 8px;
  background: #000;
  display: block;
}
@media (max-width: 640px) {
  .input-row {
    flex-direction: column;
    align-items: stretch;
  }
  .range-row {
    justify-content: flex-start;
  }
  button {
    width: 100%;
  }
}
</style>
</head>
<body>
<div class="title">M3U8 手动解密下载工具【并发版】</div>

<div class="card">
  <div class="input-row">
    <input id="urlInput" placeholder="粘贴 m3u8 地址">
    <button id="parseBtn">解析M3U8</button>
  </div>
</div>

<div class="card">
  <div id="keyInfo">等待解析 KEY / IV 信息...</div>
</div>

<div class="card">
  <div class="range-row">
    <span>分片区间（序号）：</span>
    <input id="startSn" type="number" min="1" placeholder="起始">
    <span> ~ </span>
    <input id="endSn" type="number" min="1" placeholder="结束">
    <button id="downloadRangeBtn" disabled>下载区间</button>
    <button id="downloadAllBtn" disabled>下载全部</button>
  </div>
</div>

<div class="card">
  <div id="progress">等待下载任务...</div>
</div>

<div class="card video-wrap">
  <video id="video" controls></video>
</div>

<script>
const urlInput = document.getElementById('urlInput');
const parseBtn = document.getElementById('parseBtn');
const downloadAllBtn = document.getElementById('downloadAllBtn');
const downloadRangeBtn = document.getElementById('downloadRangeBtn');
const startSnInput = document.getElementById('startSn');
const endSnInput = document.getElementById('endSn');
const keyInfoDom = document.getElementById('keyInfo');
const progressDom = document.getElementById('progress');
const video = document.getElementById('video');

let m3u8Data = null;
let isDownloading = false;
const CONCURRENCY = 6; // 并发数量，建议 4~8，不要开太大

// 十六进制字符串转 Uint8Array
function hexToUint8Array(hex) {
  hex = hex.replace(/^0x/, '');
  if (hex.length % 2 !== 0) hex = '0' + hex;
  const bytes = new Uint8Array(hex.length / 2);
  for (let i = 0; i < hex.length; i += 2) {
    bytes[i / 2] = parseInt(hex.substr(i, 2), 16);
  }
  return bytes;
}

// 解析m3u8
function parseM3u8(text, baseUrl) {
  const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  const result = {
    encrypted: false,
    method: '',
    keyUri: '',
    ivHex: '',
    fragments: [],
    mediaSequence: 0
  };
  let sn = 0;
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    if (line.startsWith('#EXT-X-KEY:')) {
      result.encrypted = true;
      const methodMatch = line.match(/METHOD=([^,]+)/);
      const uriMatch = line.match(/URI="([^"]+)"/);
      const ivMatch = line.match(/IV=([^\s,]+)/);
      if (methodMatch) result.method = methodMatch[1];
      if (uriMatch) result.keyUri = new URL(uriMatch[1], baseUrl).href;
      if (ivMatch) result.ivHex = ivMatch[1].replace(/^0x/, '');
    } else if (line.startsWith('#EXT-X-MEDIA-SEQUENCE:')) {
      result.mediaSequence = parseInt(line.split(':')[1]);
      sn = result.mediaSequence;
    } else if (line.startsWith('#EXTINF:')) {
      const duration = parseFloat(line.split(':')[1].split(',')[0]);
      i++;
      if (i < lines.length && !lines[i].startsWith('#')) {
        const absoluteUrl = new URL(lines[i], baseUrl).href;
        result.fragments.push({
          sn: sn,
          duration: duration,
          url: absoluteUrl
        });
        sn++;
      }
    }
  }
  return result;
}

// 导入AES密钥
async function importAesKey(keyBuffer) {
  return await crypto.subtle.importKey(
    'raw',
    keyBuffer,
    { name: 'AES-CBC' },
    false,
    ['decrypt']
  );
}

// AES解密分片
async function decryptFragment(encryptedBuffer, key, iv) {
  const decrypted = await crypto.subtle.decrypt(
    { name: 'AES-CBC', iv: iv },
    encryptedBuffer
  );
  return new Uint8Array(decrypted);
}

// 下载文件
function downloadBlob(blob, filename){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
}

// 并发任务调度（限制并发数）
async function poolRunner(tasks, concurrency) {
  const results = new Array(tasks.length);
  let idx = 0;
  const run = async () => {
    while(idx < tasks.length) {
      const curIdx = idx++;
      results[curIdx] = await tasks[curIdx]();
    }
  }
  const workers = Array.from({length: concurrency}, () => run());
  await Promise.all(workers);
  return results;
}

parseBtn.onclick = async ()=>{
  const m3u8Url = urlInput.value.trim();
  if(!m3u8Url){
    keyInfoDom.innerText = "请输入m3u8地址";
    return;
  }
  m3u8Data = null;
  downloadAllBtn.disabled = true;
  downloadRangeBtn.disabled = true;
  keyInfoDom.innerText = "正在请求m3u8原始文本...";
  progressDom.innerText = "解析中...";

  try {
    const resp = await fetch(m3u8Url);
    if(!resp.ok) throw new Error("请求失败：HTTP "+resp.status);
    const m3u8Text = await resp.text();
    m3u8Data = parseM3u8(m3u8Text, m3u8Url);

    if(m3u8Data.encrypted){
      keyInfoDom.innerText = 
`✅ 从 #EXT-X-KEY 行解析成功
加密方式：${m3u8Data.method}
密钥地址：${m3u8Data.keyUri}
IV(十六进制)：${m3u8Data.ivHex || '未指定（使用分片SN）'}
⚠️ 提示：输出文件后缀为mp4，内部仍是TS流，部分播放器无法打开`;
    }else{
      keyInfoDom.innerText = "⚠️ 该m3u8无加密";
    }
    progressDom.innerText = `解析完成，总分片：${m3u8Data.fragments.length} 片`;
    downloadAllBtn.disabled = false;
    downloadRangeBtn.disabled = false;
  } catch (err) {
    keyInfoDom.innerText = "❌ 解析失败："+ err.message +"\n请检查地址、CORS跨域";
    progressDom.innerText = "解析失败";
    console.error(err);
  }
};

// 下载处理函数【并发调度版本】
async function downloadFragList(selectedFrags){
  if(isDownloading || selectedFrags.length === 0) return;
  isDownloading = true;
  downloadAllBtn.disabled = true;
  downloadRangeBtn.disabled = true;
  let cryptoKey = null;
  let ivBase = null;
  const total = selectedFrags.length;

  try {
    if(m3u8Data.encrypted){
      progressDom.innerText = "🔑 正在下载密钥文件...";
      const keyResp = await fetch(m3u8Data.keyUri);
      if(!keyResp.ok) throw new Error("密钥下载失败：HTTP "+keyResp.status);
      const keyBuffer = await keyResp.arrayBuffer();
      if(keyBuffer.byteLength !== 16){
        throw new Error(`密钥长度错误：${keyBuffer.byteLength}字节，AES-128要求16字节`);
      }
      cryptoKey = await importAesKey(keyBuffer);
      if(m3u8Data.ivHex){
        ivBase = hexToUint8Array(m3u8Data.ivHex);
      }
      progressDom.innerText = `✅ 密钥下载成功，准备并发下载分片...`;
    }

    // 构造任务列表，每个任务返回 {sn, data}
    const taskList = selectedFrags.map((frag, taskIndex)=>{
      return async ()=>{
        progressDom.innerText = `📥 正在处理 ${taskIndex+1}/${total}，分片SN:${frag.sn}`;
        const resp = await fetch(frag.url);
        if(!resp.ok) throw new Error(`分片SN${frag.sn}下载失败：HTTP ${resp.status}`);
        const buf = await resp.arrayBuffer();
        let decBuf;
        if(m3u8Data.encrypted){
          const currentIv = ivBase || hexToUint8Array(frag.sn.toString(16).padStart(32, '0'));
          decBuf = await decryptFragment(buf, cryptoKey, currentIv);
        }else{
          decBuf = new Uint8Array(buf);
        }
        return {sn: frag.sn, data: decBuf};
      }
    })

    // 并发池执行
    const rawResult = await poolRunner(taskList, CONCURRENCY);
    // 【重点】按SN排序，保证顺序正确！
    rawResult.sort((a,b)=> a.sn - b.sn);
    const finalBuffers = rawResult.map(item=>item.data);

    progressDom.innerText = `✅ 全部分片解密完成，正在合并导出`;
    const finalBlob = new Blob(finalBuffers, {type:"video/mp4"});
    downloadBlob(finalBlob, "video.mp4");
    progressDom.innerText = `🎉 导出成功 video.mp4`;
  } catch (err) {
    progressDom.innerText = "❌ 下载解密失败："+ err.message;
    console.error(err);
  }
  isDownloading = false;
  downloadAllBtn.disabled = false;
  downloadRangeBtn.disabled = false;
}

downloadAllBtn.onclick = async ()=>{
  await downloadFragList(m3u8Data.fragments);
}

downloadRangeBtn.onclick = async ()=>{
  const startIdx = Number(startSnInput.value) - 1;
  const endIdx = Number(endSnInput.value) - 1;
  const maxIdx = m3u8Data.fragments.length - 1;
  if(isNaN(startIdx) || isNaN(endIdx)){
    progressDom.innerText = "❌ 请输入合法数字";
    return;
  }
  if(startIdx < 0 || endIdx > maxIdx){
    progressDom.innerText = `❌ 范围越界！总分片：${m3u8Data.fragments.length}`;
    return;
  }
  if(startIdx > endIdx){
    progressDom.innerText = "❌ 起始分片不能大于结束分片";
    return;
  }
  const selected = m3u8Data.fragments.slice(startIdx, endIdx + 1);
  await downloadFragList(selected);
}
</script>
</body>
</html>
