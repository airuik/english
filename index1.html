<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>M3U8地址解析工具</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body{padding:20px;font-family:system-ui;}
        #urlInput{width:70%;padding:8px;font-size:16px;}
        button{padding:8px 16px;font-size:16px;cursor:pointer;}
        #result{margin-top:20px;white-space:pre-wrap;word-break:break-all;}
    </style>
</head>
<body>
    <h3>输入M3U8链接，解析分片地址</h3>
    <input type="text" id="urlInput" placeholder="粘贴m3u8地址">
    <button onclick="parseM3u8()">解析</button>
    <div id="result"></div>

<script>
async function parseM3u8(){
    const url = document.getElementById('urlInput').value.trim();
    const resultDom = document.getElementById('result');
    if(!url){
        resultDom.innerText = "请输入m3u8链接";
        return;
    }
    resultDom.innerText = "正在加载...";
    try{
        // 请求m3u8原始文本
        const resp = await fetch(url);
        const text = await resp.text();
        resultDom.innerText = "==== M3U8原始内容 ====\n" + text;

        // 提取所有ts分片行
        const lines = text.split('\n');
        const tsList = lines.filter(line=>line.trim().endsWith('.ts'));
        if(tsList.length>0){
            resultDom.innerText += "\n\n==== 提取到的TS分片地址 ====\n";
            tsList.forEach(item=>{
                resultDom.innerText += item + "\n";
            })
        }
    }catch(err){
        resultDom.innerText = `请求失败：${err.message}\n大概率是跨域CORS限制，浏览器禁止读取该m3u8内容`;
    }
}
</script>
</body>
</html>
